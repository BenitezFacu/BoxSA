{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Box SA - Ordenes de Venta</title>
    <link rel="stylesheet" href="{% static 'ordenes/estilos.css' %}">
</head>
<body>
{% csrf_token %}

<header class="encabezado">
    <div class="contenedor barra">
        <div>
            <h1>Box SA</h1>
            <span>Gestión de órdenes de venta</span>
        </div>
        <button class="boton boton-principal" onclick="abrirVentana(0)">+ Nueva OV</button>
    </div>
</header>

<main class="contenedor">

    <section class="resumen">
        <div class="dato"><strong id="totalOrdenes">0</strong><span>OV generadas</span></div>
        <div class="dato"><strong id="totalPendientes">0</strong><span>Pendientes</span></div>
        <div class="dato"><strong id="totalProcesadas">0</strong><span>Procesadas</span></div>
        <div class="dato"><strong id="montoTotal">$ 0,00</strong><span>Monto total</span></div>
    </section>

    <section class="tarjeta">
        <div class="herramientas">
            <input type="text" id="buscar" placeholder="Buscar por número o cliente..." oninput="dibujarOrdenes()">
            <select id="filtro" onchange="dibujarOrdenes()">
                <option value="todas">Todas</option>
                <option value="Pendiente">Pendientes</option>
                <option value="Procesada">Procesadas</option>
            </select>
        </div>
        <div class="tabla-contenedor">
            <table>
                <thead>
                    <tr>
                        <th>Nº</th>
                        <th>Cliente</th>
                        <th>Fecha</th>
                        <th>Productos</th>
                        <th>Subtotal</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="listaOrdenes"></tbody>
            </table>
        </div>
    </section>

</main>

<div class="fondo" id="ventana" onclick="clickFondo(event)">
    <div class="ventana">
        <div class="ventana-titulo" id="tituloVentana"></div>
        <div class="ventana-cuerpo">
            <div class="datos-orden">
                <div>
                    <label for="cliente">Cliente</label>
                    <select id="cliente" onchange="cargarProductos({})"></select>
                </div>
                <div>
                    <label for="vendedor">Vendedor</label>
                    <select id="vendedor"></select>
                </div>
            </div>
            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Precio</th>
                            <th>Stock para fabricar</th>
                            <th>Cantidad</th>
                        </tr>
                    </thead>
                    <tbody id="listaProductos"></tbody>
                </table>
            </div>
            <div class="mensaje-error" id="mensajeError"></div>
        </div>
        <div class="ventana-pie">
            <div>Subtotal: <span class="total" id="subtotal">$ 0,00</span></div>
            <div>
                <button class="boton boton-gris" onclick="cerrarVentana()">Cancelar</button>
                <button class="boton boton-principal" id="botonGuardar" onclick="guardarOrden()">Guardar OV</button>
            </div>
        </div>
    </div>
</div>

<div id="aviso"></div>

<footer>
    TP SQL N°10 - Box SA - 5° año
</footer>

<script>
var ordenes = [];
var editId = 0;

function token() {
    return document.querySelector("[name=csrfmiddlewaretoken]").value;
}

function $(id) {
    return document.getElementById(id);
}

function pesos(n) {
    return "$ " + Number(n || 0).toLocaleString("es-AR", {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function limpiar(texto) {
    var div = document.createElement("div");
    div.textContent = texto == null ? "" : texto;
    return div.innerHTML;
}

function mostrarAviso(texto) {
    var aviso = $("aviso");
    aviso.textContent = texto;
    aviso.style.display = "block";
    setTimeout(function () {
        aviso.style.display = "none";
    }, 3000);
}

function mostrarError(texto) {
    var caja = $("mensajeError");
    caja.textContent = texto;
    caja.style.display = texto ? "block" : "none";
}

// ---------- Listado de ordenes ----------

function cargarOrdenes() {
    fetch("/api/ovs")
        .then(function (r) { return r.json(); })
        .then(function (datos) {
            ordenes = datos;
            dibujarOrdenes();
            actualizarResumen();
        });
}

function actualizarResumen() {
    var pendientes = 0;
    var monto = 0;
    for (var i = 0; i < ordenes.length; i++) {
        if (ordenes[i].estado == "Pendiente") pendientes++;
        monto += Number(ordenes[i].subtotal || 0);
    }
    $("totalOrdenes").textContent = ordenes.length;
    $("totalPendientes").textContent = pendientes;
    $("totalProcesadas").textContent = ordenes.length - pendientes;
    $("montoTotal").textContent = pesos(monto);
}

function dibujarOrdenes() {
    var texto = $("buscar").value.toLowerCase();
    var filtro = $("filtro").value;
    var html = "";
    for (var i = 0; i < ordenes.length; i++) {
        var o = ordenes[i];
        if (filtro != "todas" && o.estado != filtro) continue;
        if (texto != "" && (o.cliente + " " + o.id).toLowerCase().indexOf(texto) == -1) continue;
        var pendiente = o.estado == "Pendiente";
        var bloqueo = pendiente ? "" : "disabled";
        html += "<tr>" +
            "<td><strong>#" + o.id + "</strong></td>" +
            "<td>" + limpiar(o.cliente) + "</td>" +
            "<td>" + limpiar(o.fecha) + "</td>" +
            "<td>" + limpiar(o.detalle) + "</td>" +
            "<td>" + pesos(o.subtotal) + "</td>" +
            "<td><span class='estado " + (pendiente ? "estado-pendiente" : "estado-procesada") + "'>" + o.estado + "</span></td>" +
            "<td><button class='boton boton-gris boton-chico' " + bloqueo + " onclick='abrirVentana(" + o.id + ")'>Modificar</button>" +
            "<button class='boton boton-peligro boton-chico' " + bloqueo + " onclick='eliminarOrden(" + o.id + ")'>Eliminar</button></td>" +
            "</tr>";
    }
    if (html == "") {
        html = "<tr><td colspan='7' class='vacio'>No hay órdenes para mostrar.</td></tr>";
    }
    $("listaOrdenes").innerHTML = html;
}

// ---------- Ventana de alta y modificacion ----------

function llenarSelect(select, filas, elegido) {
    var html = "";
    for (var i = 0; i < filas.length; i++) {
        html += "<option value='" + filas[i].id + "'>" + limpiar(filas[i].nombre) + "</option>";
    }
    select.innerHTML = html;
    if (elegido) select.value = elegido;
}

async function abrirVentana(id) {
    editId = id;
    mostrarError("");
    $("tituloVentana").textContent = id ? "Modificar OV #" + id : "Nueva orden de venta";
    var clientes = await (await fetch("/api/clientes")).json();
    var vendedores = await (await fetch("/api/vendedores")).json();
    var previas = {};
    var idCliente = 0;
    var idVendedor = 0;
    if (id) {
        var detalle = await (await fetch("/api/ovdet?id=" + id)).json();
        idCliente = detalle[0].idcliente;
        idVendedor = detalle[0].idvendedor;
        for (var i = 0; i < detalle.length; i++) {
            previas[detalle[i].idarticulo] = detalle[i].cantidad;
        }
    }
    llenarSelect($("cliente"), clientes, idCliente);
    llenarSelect($("vendedor"), vendedores, idVendedor);
    $("cliente").disabled = id > 0;
    $("vendedor").disabled = id > 0;
    await cargarProductos(previas);
    $("ventana").classList.add("abierto");
}

function cerrarVentana() {
    $("ventana").classList.remove("abierto");
}

function clickFondo(evento) {
    if (evento.target == $("ventana")) cerrarVentana();
}

document.addEventListener("keydown", function (e) {
    if (e.key == "Escape") cerrarVentana();
});

async function cargarProductos(previas) {
    var url = "/api/productos?cliente=" + $("cliente").value + "&ov=" + editId;
    var productos = await (await fetch(url)).json();
    var html = "";
    for (var i = 0; i < productos.length; i++) {
        var p = productos[i];
        var sinReceta = p.disp == "sin receta";
        var maximo = sinReceta ? "" : Number(p.disp);
        var valor = previas[p.id] || 0;
        var claseEstado = sinReceta ? "estado-neutro" : (maximo > 0 ? "estado-procesada" : "estado-agotado");
        var textoStock = sinReceta ? "Sin receta" : maximo + " u.";
        var bloqueo = (!sinReceta && maximo == 0) ? "disabled" : "";
        html += "<tr>" +
            "<td>" + limpiar(p.nombre) + "</td>" +
            "<td>" + pesos(p.precio) + "</td>" +
            "<td><span class='estado " + claseEstado + "'>" + textoStock + "</span></td>" +
            "<td><input type='number' class='cantidad' min='0' step='1' value='" + valor + "' " + bloqueo +
            " data-id='" + p.id + "' data-precio='" + p.precio + "' data-max='" + maximo + "' oninput='validar()'>" +
            "<div class='maximo'>" + (sinReceta ? "sin límite" : "máx. " + maximo) + "</div></td>" +
            "</tr>";
    }
    if (html == "") {
        html = "<tr><td colspan='4' class='vacio'>Este cliente no tiene productos.</td></tr>";
    }
    $("listaProductos").innerHTML = html;
    validar();
}

function validar() {
    var campos = document.querySelectorAll("input.cantidad");
    var total = 0;
    var hayError = false;
    for (var i = 0; i < campos.length; i++) {
        var c = campos[i];
        var cantidad = Number(c.value || 0);
        var maximo = c.dataset.max;
        var aviso = c.nextElementSibling;
        var pasado = cantidad < 0 || (maximo != "" && cantidad > Number(maximo));
        c.classList.toggle("invalido", pasado);
        aviso.classList.toggle("rojo", pasado);
        if (pasado) hayError = true;
        total += cantidad * Number(c.dataset.precio);
    }
    $("subtotal").textContent = pesos(total);
    $("botonGuardar").disabled = hayError;
    mostrarError(hayError ? "Hay cantidades que superan el stock disponible. Corregilas para poder guardar." : "");
}

async function guardarOrden() {
    var campos = document.querySelectorAll("input.cantidad");
    var items = "";
    for (var i = 0; i < campos.length; i++) {
        var cantidad = Math.floor(Number(campos[i].value || 0));
        if (cantidad > 0) {
            if (items != "") items += ",";
            items += campos[i].dataset.id + ":" + cantidad;
        }
    }
    if (items == "") {
        mostrarError("Cargá al menos un producto con cantidad mayor a 0.");
        return;
    }
    $("botonGuardar").disabled = true;
    var url = "/api/guardar?id=" + editId + "&cliente=" + $("cliente").value + "&vendedor=" + $("vendedor").value + "&items=" + items;
    var r = await (await fetch(url, {method: "POST", headers: {"X-CSRFToken": token()}})).json();
    $("botonGuardar").disabled = false;
    if (!r.ok) {
        mostrarError(r.error);
        return;
    }
    cerrarVentana();
    mostrarAviso(editId ? "OV #" + r.id + " modificada" : "OV generada. Número: " + r.id);
    cargarOrdenes();
}

async function eliminarOrden(id) {
    if (!confirm("¿Eliminar la OV #" + id + "? Se liberan los materiales reservados.")) return;
    var r = await (await fetch("/api/eliminar?id=" + id, {method: "POST", headers: {"X-CSRFToken": token()}})).json();
    mostrarAviso(r.ok ? "OV #" + id + " eliminada" : r.error);
    cargarOrdenes();
}

cargarOrdenes();
</script>
</body>
</html>
